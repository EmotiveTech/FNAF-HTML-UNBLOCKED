<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Fazbear HTML Launcher</title>
    <style>
        body {
            background-color: #050505;
            color: #eee;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Added extra padding at the bottom so the grid doesn't hide behind the banner */
            padding: 40px 40px 100px 40px;
        /* --- WEBSITE BANNER --- */
        #website-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: #111;
            border-top: 2px solid #b30000;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 10000;
            transition: 0.3s;
            cursor: pointer;
            letter-spacing: 2px;
        }
       
        #website-banner:hover {
            background: #b30000;
            color: #fff;
            box-shadow: 0 0 15px #b30000;
        }

        /* --- MONITOR TRIGGER --- */
        #monitor-trigger {
            position: fixed;
            bottom: 40px; /* Shifted up to sit exactly on top of the 40px website banner */
    <a href="https://YOUR-WEBSITE-URL-HERE.com" target="_blank" id="website-banner">
        VISIT MY MAIN WEBSITE
    </a>

    <div id="monitor-trigger"></div>

    <script src="renamer.js"></script>

    <script>
        // --- VERSION CONTROL ---
        const CURRENT_VERSION = "v2.1";
        const savedVersion = localStorage.getItem('faz_system_version');
       
        if (savedVersion !== CURRENT_VERSION) {
            localStorage.removeItem('faz_mute_update');
            localStorage.setItem('faz_system_version', CURRENT_VERSION);
        }

        // --- POPUP LOGIC ---
        (function checkPopup() {
            const isMuted = localStorage.getItem('faz_mute_update');
            if (isMuted !== "true") {
                document.getElementById('popup-overlay').classList.remove('hidden');
            }
        })();

        function closePopup() {
            const checkbox = document.getElementById('popup-mute');
            if (checkbox.checked) {
                localStorage.setItem('faz_mute_update', "true");
            }
            document.getElementById('popup-overlay').classList.add('hidden');
        }

        // --- MONITOR HOVER LOGIC ---
        const trigger = document.getElementById('monitor-trigger');
        const overlay = document.getElementById('camera-overlay');
        let isMonitorOpen = false;
        let isLocked = false;

        trigger.addEventListener('mouseenter', function() {
            if (isLocked) return;
            isLocked = true;
            setTimeout(() => { isLocked = false; }, 500);

            if (!isMonitorOpen) {
                overlay.style.display = 'flex';
                trigger.style.background = '#0088ff';
                trigger.style.borderColor = '#0088ff';
                trigger.innerText = "▼ HOVER TO CLOSE ▼";
                isMonitorOpen = true;
            } else {
                overlay.style.display = 'none';
                trigger.style.background = '';
                trigger.style.borderColor = '';
                trigger.innerText = "";
                isMonitorOpen = false;
            }
        });
    </script>
</body>
</html>
