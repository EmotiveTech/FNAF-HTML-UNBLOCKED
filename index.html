<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Offline - Update Pending</title>
    <style>
        body {
            background-color: #050505;
            color: #eee;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        /* --- BUTTONS (Top) --- */
        .top-btn {
            position: fixed;
            top: 20px;
            border: 1px solid #333;
            padding: 10px 15px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            background: #0a0a0a;
            transition: 0.3s;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
        }
        .top-btn:hover {
            color: #b30000;
            border-color: #b30000;
            box-shadow: 0 0 15px rgba(179, 0, 0, 0.4);
        }
        #dev-mode-btn { left: 20px; }
        #github-btn { left: 185px; } /* Shifted to the right to make room for Dev Mode */
        #admin-btn { right: 20px; }

        /* --- MAIN CONTENT --- */
        .content-box {
            background: #111;
            border: 2px solid #222;
            padding: 50px 40px;
            border-radius: 5px;
            box-shadow: inset 0 0 30px #000, 0 0 20px rgba(0,0,0,0.8);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #b30000;
            text-shadow: 2px 2px 5px #000;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            color: #888;
            font-size: 1.1rem;
            margin: 0 0 20px 0;
        }

        /* --- TIMER --- */
        #timer-display {
            font-size: 2rem;
            color: #fff;
            background: #000;
            border: 1px solid #444;
            padding: 15px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #fff;
        }

        /* --- CONTINUE BUTTON --- */
        .continue-btn {
            display: inline-block;
            margin-top: 30px;
            background: #8b0000;
            color: #fff;
            border: 2px solid #ff0000;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px #8b0000;
            letter-spacing: 2px;
        }
        
        .continue-btn:hover {
            background: #b30000;
            box-shadow: 0 0 25px #ff0000;
            transform: scale(1.05);
            border-color: #ff3333;
        }

        /* --- MENUS & OVERLAYS (Hidden) --- */
        .hidden { display: none !important; }

        .overlay-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: flex; justify-content: center; align-items: center;
        }

        .admin-box {
            background: #111; border: 2px solid #b30000; padding: 30px;
            text-align: center; box-shadow: 0 0 30px #b30000;
        }

        .admin-box input {
            background: #000; border: 1px solid #555; color: #fff;
            padding: 10px; margin: 10px 0; width: 80%; font-family: inherit;
        }

        .admin-box button {
            background: #b30000; color: #fff; border: none; padding: 10px 20px;
            cursor: pointer; font-family: inherit; font-weight: bold; margin: 5px;
        }
        .admin-box button:hover { background: #ff0000; }
        .btn-cancel { background: #333 !important; }
        .btn-cancel:hover { background: #555 !important; }

        .error-msg {
            color: #ff3333;
            font-size: 0.8rem;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }

    </style>
</head>
<body>

    <div class="top-btn" id="dev-mode-btn" onclick="openDevLogin()">DEVELOPER MODE</div>
    <a href="https://github.com/EmotiveTech/" target="_blank" class="top-btn" id="github-btn">RETURN TO GITHUB</a>
    <div class="top-btn" id="admin-btn" onclick="requestPin()">CONFIG</div>

    <div class="content-box">
        <h1>UPDATE PENDING</h1>
        <p>System offline for maintenance.<br>ETA until deployment:</p>
        <div id="timer-display">00d 00h 00m 00s</div>
        
        <a href="index3.html" class="continue-btn">CONTINUE TO GAMES</a>
    </div>

    <div id="dev-login-menu" class="overlay-menu hidden">
        <div class="admin-box">
            <h2 style="color: #b30000; margin-top: 0;">DEVELOPER LOGIN</h2>
            <input type="text" id="dev-user" placeholder="Username" autocomplete="off">
            <input type="password" id="dev-pass" placeholder="Password">
            <br>
            <button onclick="checkDevLogin()">AUTHORIZE</button>
            <button class="btn-cancel" onclick="closeDevLogin()">CANCEL</button>
            <div id="dev-error" class="error-msg">ACCESS DENIED: Invalid Credentials</div>
        </div>
    </div>

    <div id="admin-menu" class="overlay-menu hidden">
        <div class="admin-box">
            <h2 style="color: #b30000; margin-top: 0;">TIMER CONFIGURATION</h2>
            <p style="font-size: 0.8rem; color: #888;">(Note: This only changes it locally on your device)</p>
            
            <label>Set Target Date & Time:</label><br>
            <input type="datetime-local" id="datetime-input">
            <br><br>
            
            <button onclick="saveTimer()">SAVE ALGORITHM</button>
            <button class="btn-cancel" onclick="closeAdmin()">CANCEL</button>
            <button class="btn-cancel" onclick="resetTimer()" style="display: block; width: 100%; margin-top: 10px;">RESET TO DEFAULT</button>
        </div>
    </div>

    <script>
        // --- FAZBEAR TAB RENAMER V3.0 (AUTO-GRABBER) ---
        (function() {
            // 1. SETUP HTML FOR THE MENU
            const html = `
            <div id="cloaker-menu" style="
                display: none; 
                position: fixed; 
                top: 50%; 
                left: 50%; 
                transform: translate(-50%, -50%); 
                background: #111; 
                border: 2px solid #b30000; 
                padding: 20px; 
                z-index: 99999; 
                font-family: 'Courier New', monospace; 
                color: #eee; 
                text-align: center;
                box-shadow: 0 0 50px #000;
                width: 350px;
            ">
                <h3 style="color: #b30000; margin-top: 0;">TAB CLOAKER V3</h3>
                
                <label style="font-size: 0.8rem; color: #888;">QUICK SELECT:</label><br>
                <select id="cloak-preset" style="width: 95%; margin-bottom: 15px; padding: 5px; background: #222; color: #fff; border: 1px solid #444;">
                    <option value="">-- Choose a Disguise --</option>
                    <option value="Google Drive|https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">Google Drive</option>
                    <option value="Google Classroom|https://ssl.gstatic.com/classroom/favicon.png">Google Classroom</option>
                    <option value="Google Docs|https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico">Google Docs</option>
                    <option value="My Drive - Google Drive|https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png">My Drive</option>
                    <option value="Inbox (1) - Gmail|https://ssl.gstatic.com/ui/v1/icons/mail/rfr/gmail.ico">Gmail</option>
                    <option value="Wikipedia|https://en.wikipedia.org/static/favicon/wikipedia.ico">Wikipedia</option>
                    <option value="Canvas|https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico">Canvas</option>
                    <option value="Schoology|https://ui.schoology.com/design-system/assets/favicon-d123.ico">Schoology</option>
                </select>
                
                <hr style="border-color: #333; margin: 10px 0;">

                <label style="font-size: 0.8rem;">TAB TITLE:</label><br>
                <input type="text" id="cloak-title" placeholder="e.g. Math Notes" style="width: 90%; margin-bottom: 10px; padding: 5px; background: #000; color: #fff; border: 1px solid #333;"><br>
                
                <label style="font-size: 0.8rem;">WEBSITE ICON GRABBER:</label><br>
                <div style="display: flex; justify-content: center; gap: 5px; margin-bottom: 15px;">
                    <input type="text" id="cloak-domain" placeholder="e.g. roblox.com" style="width: 60%; padding: 5px; background: #000; color: #fff; border: 1px solid #333;">
                    <button id="btn-grab" style="width: 30%; background: #444; color: white; border: none; cursor: pointer; font-size: 0.7rem;">GET ICON</button>
                </div>

                <input type="hidden" id="cloak-icon-url">
                
                <div style="margin-bottom: 15px;">
                    <img id="icon-preview" src="" style="width: 32px; height: 32px; display: none; border: 1px solid #555;">
                </div>
                
                <button id="btn-cloak" style="background: #b30000; color: white; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold;">APPLY</button>
                <button id="btn-reset-cloak" style="background: #333; color: white; border: none; padding: 10px 20px; cursor: pointer; margin-left: 5px;">RESET</button>
                
                <div style="margin-top: 10px; font-size: 0.7rem; color: #666;">Press Alt + R to Open / ESC to Close</div>
            </div>
            `;

            // Add to body
            const div = document.createElement('div');
            div.innerHTML = html;
            document.body.appendChild(div);

            // --- VARIABLES ---
            const menu = document.getElementById('cloaker-menu');
            const inputTitle = document.getElementById('cloak-title');
            const inputDomain = document.getElementById('cloak-domain');
            const inputIconUrl = document.getElementById('cloak-icon-url');
            const selectPreset = document.getElementById('cloak-preset');
            const imgPreview = document.getElementById('icon-preview');
            
            const btnGrab = document.getElementById('btn-grab');
            const btnApply = document.getElementById('btn-cloak');
            const btnReset = document.getElementById('btn-reset-cloak');

            // --- FUNCTIONS ---

            function setFavicon(url) {
                let link = document.querySelector("link[rel~='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.getElementsByTagName('head')[0].appendChild(link);
                }
                link.href = url;
            }

            function loadSettings() {
                const savedTitle = localStorage.getItem('faz_cloak_title');
                const savedIcon = localStorage.getItem('faz_cloak_icon');

                if (savedTitle) {
                    document.title = savedTitle;
                    inputTitle.value = savedTitle;
                }

                if (savedIcon) {
                    setFavicon(savedIcon);
                    inputIconUrl.value = savedIcon;
                    showPreview(savedIcon);
                }
            }

            function showPreview(url) {
                imgPreview.src = url;
                imgPreview.style.display = 'inline-block';
            }

            // 1. PRESET HANDLER
            selectPreset.addEventListener('change', function() {
                const val = this.value;
                if(!val) return;
                
                const parts = val.split('|'); // Split "Name|URL"
                inputTitle.value = parts[0];
                inputIconUrl.value = parts[1];
                showPreview(parts[1]);
            });

            // 2. DOMAIN GRABBER HANDLER
            btnGrab.addEventListener('click', function() {
                const domain = inputDomain.value.trim();
                if(!domain) return;

                // Use Google's S2 Service to fetch favicon
                const iconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
                
                inputIconUrl.value = iconUrl;
                showPreview(iconUrl);
            });

            // 3. APPLY SETTINGS
            function applyCloak() {
                const t = inputTitle.value;
                const i = inputIconUrl.value;

                if (t) {
                    document.title = t;
                    localStorage.setItem('faz_cloak_title', t);
                }
                
                if (i) {
                    setFavicon(i);
                    localStorage.setItem('faz_cloak_icon', i);
                }

                menu.style.display = 'none';
            }

            // 4. RESET
            function resetCloak() {
                localStorage.removeItem('faz_cloak_title');
                localStorage.removeItem('faz_cloak_icon');
                location.reload(); 
            }

            // --- KEY LISTENERS ---
            document.addEventListener('keydown', function(e) {
                if (e.altKey && e.key.toLowerCase() === 'r') {
                    e.preventDefault();
                    menu.style.display = 'block';
                }
                if (e.key === 'Escape') {
                    menu.style.display = 'none';
                }
            });

            btnApply.addEventListener('click', applyCloak);
            btnReset.addEventListener('click', resetCloak);

            // Load on start
            loadSettings();

        })();
        
        // =========================================================
        const DEFAULT_TARGET_DATE = "2026-03-11T2:45";
        // =========================================================

        const display = document.getElementById('timer-display');
        const adminMenu = document.getElementById('admin-menu');
        const dateTimeInput = document.getElementById('datetime-input');
        
        // --- NEW DEVELOPER LOGIN LOGIC ---
        const devLoginMenu = document.getElementById('dev-login-menu');
        const devError = document.getElementById('dev-error');

        function openDevLogin() {
            devLoginMenu.classList.remove('hidden');
            document.getElementById('dev-user').value = '';
            document.getElementById('dev-pass').value = '';
            devError.style.display = 'none';
            document.getElementById('dev-user').focus();
        }

        function closeDevLogin() {
            devLoginMenu.classList.add('hidden');
        }

        function checkDevLogin() {
            const user = document.getElementById('dev-user').value;
            const pass = document.getElementById('dev-pass').value;

            if (user === 'admin' && pass === 'admin') {
                window.location.href = 'index2.html';
            } else {
                devError.style.display = 'block';
            }
        }

        // --- PIN VERIFICATION ---
        function requestPin() {
            const pin = prompt("ENTER SYSTEM PIN:");
            if (pin === "04271224") {
                openAdmin();
            } else if (pin !== null) {
                alert("ACCESS DENIED");
            }
        }

        // --- ADMIN MENU LOGIC ---
        function openAdmin() {
            adminMenu.classList.remove('hidden');
            let currentTarget = localStorage.getItem('faz_target_date') || DEFAULT_TARGET_DATE;
            dateTimeInput.value = currentTarget;
        }

        function closeAdmin() {
            adminMenu.classList.add('hidden');
        }

        function saveTimer() {
            if (!dateTimeInput.value) return alert("Please select a date and time.");
            localStorage.setItem('faz_target_date', dateTimeInput.value);
            closeAdmin();
            updateTimer(); 
        }

        function resetTimer() {
            localStorage.removeItem('faz_target_date');
            closeAdmin();
            updateTimer();
        }

        // --- COUNTDOWN LOGIC ---
        function updateTimer() {
            const targetString = localStorage.getItem('faz_target_date') || DEFAULT_TARGET_DATE;
            const targetTime = new Date(targetString).getTime();
            const now = new Date().getTime();
            const diff = targetTime - now;

            if (diff <= 0) {
                display.innerHTML = "DEPLOYMENT READY";
                display.style.color = "#b30000";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const d = String(days).padStart(2, '0');
            const h = String(hours).padStart(2, '0');
            const m = String(minutes).padStart(2, '0');
            const s = String(seconds).padStart(2, '0');

            display.innerHTML = `${d}d ${h}h ${m}m ${s}s`;
            display.style.color = "#fff";
        }

        setInterval(updateTimer, 1000);
        updateTimer(); 

    </script>
</body>
</html>
