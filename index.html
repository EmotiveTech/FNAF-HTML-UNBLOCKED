<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Fazbear HTML Launcher</title>
    <style>
        body {
            background-color: #050505;
            color: #eee;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        h1 {
            color: #b30000;
            text-shadow: 2px 2px 5px #000;
            letter-spacing: 5px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 30px;
            max-width: 1000px;
        }

        .game-card {
            background: #111;
            border: 2px solid #222;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .game-card:hover {
            border-color: #b30000;
            background: #1a0000;
            transform: scale(1.05);
            box-shadow: 0 0 15px #b30000;
        }

        .game-card h3 {
            margin: 10px 0;
            font-size: 1.1rem;
        }

        .status {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1>FAZBEAR ENTERTAINMENT: SYSTEMS</h1>

    <div class="grid">
        <a href="1/index.html" class="game-card">
            <div class="status">System Online</div>
            <h3>FNAF 1</h3>
        </a>
        <a href="2/index.html" class="game-card">
            <div class="status">System Online</div>
            <h3>FNAF 2</h3>
        </a>
        <a href="3/index.html" class="game-card">
            <div class="status">System Online</div>
            <h3>FNAF 3</h3>
        </a>
        <a href="4/index.html" class="game-card">
            <div class="status">System Online</div>
            <h3>FNAF 4</h3>
        </a>
        <a href="sl/index.html" class="game-card">
            <div class="status">System Online</div>
            <h3>Sister Location</h3>
        </a>
        <a href="ps/index.html" class="game-card">
            <div class="status">System Online</div>
            <h3>Pizzeria Sim</h3>
        </a>
        <a href="ucn/index.html" class="game-card">
            <div class="status">System Online</div>
            <h3>UCN</h3>
        </a>
        <a href="w/index.html" class="game-card">
            <div class="status">System Online</div>
            <h3>World</h3>
        </a>
    </div>
<script>
(function() {
    // CONFIGURATION
    const KEY_TRIGGER = 'r'; // The letter to press
    const REQUIRE_ALT = true; // Require Alt key?

    document.addEventListener('keydown', function(e) {
        // Check for Alt + R
        if (e.key.toLowerCase() === KEY_TRIGGER && e.altKey === REQUIRE_ALT) {
            e.preventDefault();
            openRenamerMenu();
        }
    });

    function openRenamerMenu() {
        // Prevent opening multiple menus
        if (document.getElementById('tab-renamer-overlay')) return;

        // 1. Create the Overlay
        const overlay = document.createElement('div');
        overlay.id = 'tab-renamer-overlay';
        overlay.style.cssText = `
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 10000;
            display: flex; justify-content: center; align-items: center;
            font-family: Arial, sans-serif;
        `;

        // 2. Create the Box
        const box = document.createElement('div');
        box.style.cssText = `
            background: white; padding: 25px; border-radius: 8px;
            width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 15px;
        `;

        // 3. Title & Inputs
        const header = document.createElement('h3');
        header.innerText = "Rename Tab";
        header.style.margin = "0 0 5px 0";

        const inputName = document.createElement('input');
        inputName.placeholder = "New Tab Title";
        inputName.value = document.title;
        inputName.style.cssText = "padding: 10px; border: 1px solid #ccc; border-radius: 4px;";

        const inputIcon = document.createElement('input');
        inputIcon.placeholder = "New Icon URL (https://...)";
        inputIcon.style.cssText = "padding: 10px; border: 1px solid #ccc; border-radius: 4px;";

        // 4. Buttons
        const btnRow = document.createElement('div');
        btnRow.style.cssText = "display: flex; justify-content: flex-end; gap: 10px;";

        const btnCancel = document.createElement('button');
        btnCancel.innerText = "Cancel";
        btnCancel.style.cssText = "padding: 8px 15px; cursor: pointer; border: none; background: #eee; border-radius: 4px;";
        
        const btnSave = document.createElement('button');
        btnSave.innerText = "Save";
        btnSave.style.cssText = "padding: 8px 15px; cursor: pointer; border: none; background: #007bff; color: white; border-radius: 4px;";

        // 5. Actions
        const closeMenu = () => overlay.remove();

        btnCancel.onclick = closeMenu;
        overlay.onclick = (e) => { if(e.target === overlay) closeMenu(); };

        btnSave.onclick = () => {
            // Update Title
            if (inputName.value) document.title = inputName.value;
            
            // Update Icon
            if (inputIcon.value) {
                let link = document.querySelector("link[rel*='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'shortcut icon';
                    document.head.appendChild(link);
                }
                link.href = inputIcon.value;
                // Trick to force browser refresh of icon
                document.head.removeChild(link);
                document.head.appendChild(link);
            }
            closeMenu();
        };

        // Assemble
        btnRow.appendChild(btnCancel);
        btnRow.appendChild(btnSave);
        box.appendChild(header);
        box.appendChild(inputName);
        box.appendChild(inputIcon);
        box.appendChild(btnRow);
        overlay.appendChild(box);
        document.body.appendChild(overlay);
        
        // Focus the name input immediately
        inputName.focus();
    }
})();
</script>
</body>
</html>
