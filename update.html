<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Offline - Update Pending</title>
    <style>
        body {
            background-color: #050505;
            color: #eee;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
        }

        /* --- BUTTONS (Top Left & Right) --- */
        .top-btn {
            position: fixed;
            top: 20px;
            border: 1px solid #333;
            padding: 10px 15px;
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
            background: #0a0a0a;
            transition: 0.3s;
            font-weight: bold;
            cursor: pointer;
            z-index: 1000;
        }
        .top-btn:hover {
            color: #b30000;
            border-color: #b30000;
            box-shadow: 0 0 15px rgba(179, 0, 0, 0.4);
        }
        #github-btn { left: 20px; }
        #admin-btn { right: 20px; }

        /* --- MAIN CONTENT --- */
        .content-box {
            background: #111;
            border: 2px solid #222;
            padding: 50px 40px;
            border-radius: 5px;
            box-shadow: inset 0 0 30px #000, 0 0 20px rgba(0,0,0,0.8);
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #b30000;
            text-shadow: 2px 2px 5px #000;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            color: #888;
            font-size: 1.1rem;
            margin: 0 0 20px 0;
        }

        /* --- TIMER --- */
        #timer-display {
            font-size: 2rem;
            color: #fff;
            background: #000;
            border: 1px solid #444;
            padding: 15px;
            letter-spacing: 3px;
            text-shadow: 0 0 10px #fff;
        }

        /* --- ADMIN MENU (Hidden) --- */
        .hidden { display: none !important; }

        #admin-menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: flex; justify-content: center; align-items: center;
        }

        .admin-box {
            background: #111; border: 2px solid #b30000; padding: 30px;
            text-align: center; box-shadow: 0 0 30px #b30000;
        }

        .admin-box input {
            background: #000; border: 1px solid #555; color: #fff;
            padding: 10px; margin: 10px 0; width: 80%; font-family: inherit;
        }

        .admin-box button {
            background: #b30000; color: #fff; border: none; padding: 10px 20px;
            cursor: pointer; font-family: inherit; font-weight: bold; margin: 5px;
        }
        .admin-box button:hover { background: #ff0000; }
        .btn-cancel { background: #333 !important; }
        .btn-cancel:hover { background: #555 !important; }

    </style>
</head>
<body>

    <a href="https://github.com/EmotiveTech/" target="_blank" class="top-btn" id="github-btn">RETURN TO GITHUB</a>
    <div class="top-btn" id="admin-btn" onclick="requestPin()">CONFIG</div>

    <div class="content-box">
        <h1>UPDATE PENDING</h1>
        <p>System offline for maintenance.<br>ETA until deployment:</p>
        <div id="timer-display">00d 00h 00m 00s</div>
    </div>

    <div id="admin-menu" class="hidden">
        <div class="admin-box">
            <h2 style="color: #b30000; margin-top: 0;">TIMER CONFIGURATION</h2>
            <p style="font-size: 0.8rem; color: #888;">(Note: This only changes it locally on your device)</p>
            
            <label>Set Target Date & Time:</label><br>
            <input type="datetime-local" id="datetime-input">
            <br><br>
            
            <button onclick="saveTimer()">SAVE ALGORITHM</button>
            <button class="btn-cancel" onclick="closeAdmin()">CANCEL</button>
            <button class="btn-cancel" onclick="resetTimer()" style="display: block; width: 100%; margin-top: 10px;">RESET TO DEFAULT</button>
        </div>
    </div>

    <script>
        // =========================================================
        // IMPORTANT: Change this date to change it for EVERYONE visiting your site!
        // Format: YYYY-MM-DDTHH:MM (e.g., 2024-12-31T23:59)
        const DEFAULT_TARGET_DATE = "2026-02-24T11:30";
        // =========================================================

        const display = document.getElementById('timer-display');
        const adminMenu = document.getElementById('admin-menu');
        const dateTimeInput = document.getElementById('datetime-input');

        // --- PIN VERIFICATION ---
        function requestPin() {
            const pin = prompt("ENTER SYSTEM PIN:");
            if (pin === "04271224") {
                openAdmin();
            } else if (pin !== null) {
                alert("ACCESS DENIED");
            }
        }

        // --- ADMIN MENU LOGIC ---
        function openAdmin() {
            adminMenu.classList.remove('hidden');
            // Pre-fill the input with current saved date
            let currentTarget = localStorage.getItem('faz_target_date') || DEFAULT_TARGET_DATE;
            dateTimeInput.value = currentTarget;
        }

        function closeAdmin() {
            adminMenu.classList.add('hidden');
        }

        function saveTimer() {
            if (!dateTimeInput.value) return alert("Please select a date and time.");
            localStorage.setItem('faz_target_date', dateTimeInput.value);
            closeAdmin();
            updateTimer(); // Force update immediately
        }

        function resetTimer() {
            localStorage.removeItem('faz_target_date');
            closeAdmin();
            updateTimer();
        }

        // --- COUNTDOWN LOGIC ---
        function updateTimer() {
            // Check for locally saved date first, otherwise use the code's default
            const targetString = localStorage.getItem('faz_target_date') || DEFAULT_TARGET_DATE;
            const targetTime = new Date(targetString).getTime();
            const now = new Date().getTime();
            const diff = targetTime - now;

            if (diff <= 0) {
                display.innerHTML = "DEPLOYMENT READY";
                display.style.color = "#b30000";
                return;
            }

            // Math to calculate time chunks
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            // Format numbers to always show two digits (e.g., "05" instead of "5")
            const d = String(days).padStart(2, '0');
            const h = String(hours).padStart(2, '0');
            const m = String(minutes).padStart(2, '0');
            const s = String(seconds).padStart(2, '0');

            display.innerHTML = `${d}d ${h}h ${m}m ${s}s`;
            display.style.color = "#fff"; // Reset color if it was finished
        }

        // Run the timer every 1 second (1000 milliseconds)
        setInterval(updateTimer, 1000);
        updateTimer(); // Run once immediately to prevent a 1-second blank screen

    </script>
</body>
</html>
