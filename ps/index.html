<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's Pizzeria Simulator</title>
    <link rel="icon" href="favicon.ico" />
    <style>
        html {
            display: block;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            height: 100%;
        }

        body {
            position: relative;
            background-color: black;
            background-image: url(resources/office.png);
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100%;
        }

        a { text-decoration: none; }

        .selection {
            height: auto;
            min-height: 100vh;
            width: 100%;
            display: flex;
            overflow: hidden;
        }

        .launcher-text {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 2.5vh;
            z-index: 1;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: 0 0 200px rgba(0,0,0,0.95) inset;
            pointer-events: none;
            z-index: 5;
        }

        /* --- Custom Loading UI --- */
        #progress-container {
            z-index: 10;
            color: #44ff44;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 2px solid #228822;
            box-shadow: 0 0 20px #228822;
            border-radius: 5px;
        }
        
        #progress-container h2 { margin-top: 0; }
        #progress-container h3 { margin-bottom: 0; font-size: 2rem; }
    </style>
</head>

<body>
    <div class="vignette"></div>

    <div id="progress-container">
        <h2 id="loading-text">SYSTEM BOOT SEQUENCE...</h2>
        <h3 id="loading-percent">0%</h3>
    </div>

    <script>
        // ==========================================
        // 1. VERSION CONTROLLED CACHE RESET
        // ==========================================
        const CURRENT_VERSION = 'v1.6'; // Bumped to 1.6 to force the final reset
        const savedVersion = localStorage.getItem('fnaf_cache_version');

        if (savedVersion !== CURRENT_VERSION) {
            console.log("Old version detected. Wiping caches and Service Workers...");
            
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for (let registration of registrations) {
                        registration.unregister();
                    }
                });
            }

            if ('caches' in window) {
                caches.keys().then(function(cacheNames) {
                    Promise.all(cacheNames.map(cacheName => caches.delete(cacheName))).then(() => {
                        localStorage.setItem('fnaf_cache_version', CURRENT_VERSION);
                        window.location.reload(true);
                    });
                });
            } else {
                localStorage.setItem('fnaf_cache_version', CURRENT_VERSION);
                window.location.reload(true);
            }
        } else {
            // ==========================================
            // 2. MAIN GAME BOOT SEQUENCE & SMART CACHING
            // ==========================================
            const originalFetch = window.fetch;
            const parts = 20;

            function updateProgress(message, percent) {
                const textEl = document.getElementById('loading-text');
                const percentEl = document.getElementById('loading-percent');
                if (textEl) textEl.innerText = message;
                if (percentEl) percentEl.innerText = percent + "%";
            }

            function mergeFiles(fileParts) {
                return new Promise((resolve, reject) => {
                    let loadedSize = 0;
                    let buffers = [];
                    const MANUAL_CACHE_NAME = 'fnaf-massive-files-safe-v1';

                    async function fetchPart(index) {
                        if (index >= fileParts.length) {
                            updateProgress('INITIALIZING ENGINE...', 100);
                            let mergedBlob = new Blob(buffers);
                            let mergedFileUrl = URL.createObjectURL(mergedBlob);
                            buffers = null; // Clean RAM
                            resolve(mergedFileUrl);
                            return;
                        }

                        let originalUrl = fileParts[index];

                        try {
                            let cache = await caches.open(MANUAL_CACHE_NAME);
                            let cachedResponse = await cache.match(originalUrl);
                            let responseToUse;

                            if (cachedResponse) {
                                // IT IS THERE! Fast load it directly from the hard drive.
                                responseToUse = cachedResponse;
                                let percent = Math.floor(((index + 1) / fileParts.length) * 95);
                                updateProgress('LOADING FROM SAVED FILES...', percent);
                            } else {
                                // NOTHING THERE! Download it fresh using the bypass trick.
                                let bypassUrl = originalUrl + "?nocache=" + Date.now();
                                let networkResponse = await fetch(bypassUrl);
                                
                                if (!networkResponse.ok) throw new Error("Missing part: " + bypassUrl);

                                // Save a copy into the vault for next time
                                await cache.put(originalUrl, networkResponse.clone());
                                responseToUse = networkResponse;
                                
                                let percent = Math.floor(((index + 1) / fileParts.length) * 95);
                                updateProgress('DOWNLOADING FRESH FILES...', percent);
                            }

                            // Push the data into the game engine
                            let data = await responseToUse.arrayBuffer();
                            buffers.push(data);
                            loadedSize += data.byteLength;

                            // Move to the next part
                            fetchPart(index + 1);

                        } catch (error) {
                            reject(error);
                        }
                    }

                    fetchPart(0);
                });
            }

            function getParts(file, start, end) {
                let partsArr = [];
                for (let i = start; i <= end; i++) {
                    partsArr.push(file + ".part" + i);
                }
                return partsArr;
            }

            function wedone() {
                // Hide the loading screen
                document.getElementById('progress-container').style.display = 'none';
                
                // Boot the actual game engine
                let script = document.createElement('script');
                script.src = 'Runtime.js';
                document.body.appendChild(script);
            }

            // Start the whole process
            Promise.all([
                mergeFiles(getParts("resources.zip", 1, parts))
            ]).then(([resources]) => {
                window.fetch = async function (url, ...args) {
                    if (url.endsWith("resources.zip")) {
                        return originalFetch(resources, ...args);
                    } else {
                        return originalFetch(url, ...args);
                    }
                };
                wedone();
            }).catch(error => {
                updateProgress("BOOT FAILURE - MISSING FILES", 0);
                console.error(error);
            });
        }

        // ==========================================
        // 3. REGISTER THE SAFE SERVICE WORKER
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                // Adjust this path if your sw.js is located somewhere else!
                navigator.serviceWorker.register('/sw.js').then(function(registration) {
                    console.log('Safe ServiceWorker registered.');
                }).catch(function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
