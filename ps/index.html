<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's Pizzeria Simulator</title>
    <link rel="icon" href="favicon.ico" />
    <style>
        html {
            display: block;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            height: 100%;
        }

        body {
            position: relative;
            background-color: black;
            background-image: url(resources/office.png);
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100%;
        }

        a {
            text-decoration: none;
        }

        .selection {
            height: auto;
            min-height: 100vh;
            width: 100%;
            display: flex;
            overflow: hidden;
        }

        .launcher-text {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 2.5vh;
            z-index: 1;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: 0 0 200px rgba(0,0,0,0.95) inset;
            pointer-events: none;
            z-index: 5;
        }

        /* --- Custom Loading UI --- */
        #progress-container {
            z-index: 10;
            color: #44ff44;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 2px solid #228822;
            box-shadow: 0 0 20px #228822;
            border-radius: 5px;
        }
        
        #progress-container h2 { margin-top: 0; }
        #progress-container h3 { margin-bottom: 0; font-size: 2rem; }
    </style>
</head>

<body>
    <div class="vignette"></div>

    <div id="progress-container">
        <h2 id="loading-text">SYSTEM BOOT SEQUENCE...</h2>
        <h3 id="loading-percent">0%</h3>
    </div>

    <script>
        const originalFetch = window.fetch;
        const parts = 20; // Matches your resources.zip.part1 through part20 files

        function updateProgress(message, percent) {
            const textEl = document.getElementById('loading-text');
            const percentEl = document.getElementById('loading-percent');
            if (textEl) textEl.innerText = message;
            if (percentEl) percentEl.innerText = percent + "%";
        }

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let loadedSize = 0;
                
                // Changed to LET so it can be cleared from RAM later
                let buffers = [];

                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        updateProgress('INITIALIZING ENGINE...', 100);
                        
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        
                        // --- AGGRESSIVE MEMORY CLEANUP ---
                        // Tell the browser to delete the raw buffer data to prevent crashes!
                        buffers = null;
                        
                        resolve(mergedFileUrl);
                        return;
                    }

                    fetch(fileParts[index]).then((response) => {
                        if (!response.ok) throw new Error("Missing part: " + fileParts[index]);
                        return response.arrayBuffer();
                    }).then((data) => {
                        buffers.push(data);
                        loadedSize += data.byteLength;
                        
                        let percent = Math.floor(((index + 1) / fileParts.length) * 95);
                        updateProgress('LOCATING ARCHIVE PARTS...', percent);
                        
                        fetchPart(index + 1);
                    }).catch(reject);
                }

                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let partsArr = [];
            for (let i = start; i <= end; i++) {
                partsArr.push(file + ".part" + i);
            }
            return partsArr;
        }

        function wedone() {
            // Hide the loading screen
            document.getElementById('progress-container').style.display = 'none';
            
            // Boot the actual game engine
            let script = document.createElement('script');
            script.src = 'Runtime.js';
            document.body.appendChild(script);
        }

        // Start fetching and merging the 20 parts
        Promise.all([
            mergeFiles(getParts("resources.zip", 1, parts))
        ]).then(([resources]) => {
            window.fetch = async function (url, ...args) {
                if (url.endsWith("resources.zip")) {
                    return originalFetch(resources, ...args);
                } else {
                    return originalFetch(url, ...args);
                }
            };
            wedone();
        }).catch(error => {
            updateProgress("BOOT FAILURE - MISSING FILES", 0);
            console.error(error);
        });
    </script>
</body>

</html>
