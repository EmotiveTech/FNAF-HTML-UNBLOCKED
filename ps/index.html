<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's Pizzeria Simulator</title>
    <link rel="icon" href="favicon.ico" />
    <style>
        html { display: block; user-select: none; overflow: hidden; height: 100%; }
        body {
            position: relative; background-color: black;
            background-image: url(resources/office.png);
            background-position: center; background-size: cover;
            display: flex; align-items: center; justify-content: center;
            margin: 0; height: 100%;
        }
        a { text-decoration: none; }
        .selection { height: auto; min-height: 100vh; width: 100%; display: flex; overflow: hidden; }
        .launcher-text { position: absolute; left: 50%; transform: translate(-50%, 0); bottom: 2.5vh; z-index: 1; }
        .vignette { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
        .glitch { position: absolute; background-image: url(resources/background.gif); background-position: center; background-size: 50vw; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; opacity: 0.75; z-index: -1; }
        canvas { display: none; user-select: none; }
        #title { position: absolute; top: 10vh; left: 5vw; z-index: 1; height: 20vh; }
        #animatronic { position: absolute; top: -5vh; right: 7vw; height: 120vh; }
        .loader { position: absolute; display: flex; flex-direction: column; align-items: center; left: 50%; transform: translate(-50%, 0); bottom: 12vh; z-index: 1; color: white; font-family: monospace; text-align: center; width: 85vw; }
        .loader h1 { margin: 0; font-size: 5vw; }
        .loader hr { margin: 0; border: white solid 0.1vw; width: 0%; }
        .loader h2 { margin: 1vh 0; font-size: 1.4vw; }
    </style>
</head>
<body>
    <canvas id="MMFCanvas" width="1920" height="1080"> Your browser does not support Canvas, Please try again.</canvas>
    <div class="selection" id="selection">
        <img id="title" src="resources/title.png" onerror="this.style.display='none'">
        <img id="animatronic" src="resources/animatronic.png" onerror="this.style.display='none'">
        <div class="loader">
            <h1 id="percentage">0%</h1>
            <hr id="bar">
            <h2 id="stage">STARTING UP...</h2>
        </div>
    </div>
    <div class="glitch"></div>
    <img src="resources/vignette.png" class="vignette" onerror="this.style.display='none'">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        const parts = 20;
        let gametitle = document.title;
        let runtimecanvas = "resources/fnafps.cch";

        window.onload = function () {
            const map = new Map();

            function updateProgress(text, percent) {
                document.title = percent + '% ' + gametitle;
                document.getElementById('percentage').innerHTML = percent + '%';
                document.getElementById('bar').style.width = percent + '%';
                document.getElementById('stage').innerHTML = text;
            }

            async function intercept() {
                const ogfetch = window.fetch;
                window.fetch = async function (input, init) {
                    if (typeof input === 'string' && input.startsWith('resources/')) {
                        const fileName = input.split('/').pop();
                        if (map.has(fileName)) return ogfetch(map.get(fileName), init);
                    }
                    return ogfetch(input, init);
                };

                const ogopen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function (method, url) {
                    if (url.startsWith('resources/')) {
                        const fileName = url.split('/').pop();
                        if (map.has(fileName)) url = map.get(fileName);
                    }
                    return ogopen.apply(this, arguments);
                };
            }

            async function extract() {
                const res = await fetch("resources.zip");
                const arrayBuffer = await res.arrayBuffer();
                const zip = await JSZip.loadAsync(arrayBuffer);
                const files = Object.keys(zip.files).filter(name => !zip.files[name].dir);
                const totalFiles = files.length;

                for (let i = 0; i < totalFiles; i++) {
                    const file = zip.files[files[i]];
                    const blob = await file.async("blob");
                    const url = URL.createObjectURL(blob);
                    map.set(files[i], url);
                    updateProgress('BOOTING UP ARCHIVE...', Math.floor(((i + 1) / totalFiles / 2) * 100 + 50));
                }
            }

            async function wedone() {
                await extract();
                await intercept();
                const script = document.createElement('script');
                // MAKE SURE Runtime.js is in your src folder!
                script.src = 'src/Runtime.js'; 
                script.onload = () => {
                    new Runtime("MMFCanvas", runtimecanvas);
                };
                document.getElementById('MMFCanvas').style.display = 'block';
                document.getElementById('selection').style.display = 'none';
                document.title = gametitle;
                document.head.appendChild(script);
            }

            const originalFetch = window.fetch;

            function mergeFiles(fileParts) {
                return new Promise((resolve, reject) => {
                    let buffers = [];
                    let loadedSize = 0;
                    
                    // We bypass the HEAD request to avoid GitHub Pages CORS/Size errors
                    let totalSize = 250000000; // Rough estimate to make the progress bar move

                    function fetchPart(index) {
                        if (index >= fileParts.length) {
                            let mergedBlob = new Blob(buffers);
                            let mergedFileUrl = URL.createObjectURL(mergedBlob);
                            resolve(mergedFileUrl);
                            return;
                        }

                        // Add a cache buster so it doesn't get stuck on old broken downloads
                        let bypassUrl = fileParts[index] + "?nocache=" + Date.now();
                        
                        fetch(bypassUrl).then((response) => {
                            if (!response.ok) throw new Error("Missing part: " + fileParts[index]);
                            return response.arrayBuffer();
                        }).then((data) => {
                            buffers.push(data);
                            loadedSize += data.byteLength;
                            // Fake percentage cap at 50% for the downloading phase
                            let percent = Math.min(Math.floor((loadedSize / totalSize) * 50), 50);
                            updateProgress('LOCATING ARCHIVE...', percent);
                            fetchPart(index + 1);
                        }).catch((err) => {
                            document.getElementById('stage').innerHTML = "ERROR: MISSING " + fileParts[index];
                            reject(err);
                        });
                    }
                    fetchPart(0);
                });
            }

            function getParts(file, start, end) {
                let partsArr = [];
                for (let i = start; i <= end; i++) {
                    partsArr.push(file + ".part" + i);
                }
                return partsArr;
            }

            // CRITICAL: Ensure your parts are inside a folder called "src"
            Promise.all([
                mergeFiles(getParts("src/resources.zip", 1, parts))
            ]).then(([resources]) => {
                window.fetch = async function (url, ...args) {
                    if (url.endsWith("resources.zip")) {
                        return originalFetch(resources, ...args);
                    } else {
                        return originalFetch(url, ...args);
                    }
                };
                wedone();
            }).catch(err => console.error(err));
        };
        
        // Connect the Global Speed Cache from the root folder
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js', { scope: '/' });
            });
        }
    </script>
</body>
</html>
