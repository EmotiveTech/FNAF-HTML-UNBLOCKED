<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's Pizzeria Simulator</title>
    <link rel="icon" href="favicon.ico" />
    <style>
        html {
            display: block;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overflow: hidden;
            height: 100%;
        }

        body {
            position: relative;
            background-color: black;
            background-image: url(resources/office.png);
            background-position: center;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100%;
        }

        a { text-decoration: none; }

        .selection {
            height: auto;
            min-height: 100vh;
            width: 100%;
            display: flex;
            overflow: hidden;
        }

        .launcher-text {
            position: absolute;
            left: 50%;
            transform: translate(-50%, 0);
            bottom: 2.5vh;
            z-index: 1;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: 0 0 200px rgba(0,0,0,0.95) inset;
            pointer-events: none;
            z-index: 5;
        }

        /* --- Custom Loading UI --- */
        #progress-container {
            z-index: 10;
            color: #44ff44;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px;
            border: 2px solid #228822;
            box-shadow: 0 0 20px #228822;
            border-radius: 5px;
        }
        
        #progress-container h2 { margin-top: 0; }
        #progress-container h3 { margin-bottom: 0; font-size: 2rem; }
    </style>
</head>

<body>
    <div class="vignette"></div>

    <div id="progress-container">
        <h2 id="loading-text">SYSTEM BOOT SEQUENCE...</h2>
        <h3 id="loading-percent">0%</h3>
    </div>
</body>
</html>
